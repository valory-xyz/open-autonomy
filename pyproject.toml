[tool.poetry]
name = "open-autonomy"
version = "0.21.28"
description = "Open Autonomy Framework"
authors = ["developer-valory <develope@valory.xyz>"]
license = "Apache-2.0"
readme = "README.md"
packages = [{include = "autonomy"}, {include = "packages"}]
# `make eject-contracts` (run before `make dist`) copies select
# contracts from `packages/valory/contracts/` to
# `autonomy/data/contracts/` so the framework can resolve them via
# `autonomy.data.contracts.<name>` when installed without the
# packages tree. Those copies are gitignored to keep the working
# tree free of duplicates; the explicit `include` below tells
# poetry-core to bundle them in the wheel/sdist regardless.
include = [
    { path = "autonomy/data/contracts/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
# What ships to PyPI is rendered from THIS table: `make dist` runs
# `python -m build`, which resolves the `poetry.core.masonry.api`
# backend declared under `[build-system]` below, so poetry-core writes
# `requires_dist` from here. The root `setup.py` is not on that path —
# it is reached only by the legacy `make install` target, and its
# `install_requires` / `extras_require` never reach published
# metadata. Declare runtime deps here.
python = ">=3.10,<3.15"
# Core runtime
open-aea = { version = "==2.2.9", extras = ["all"] }
# CLI deps. `click`, `pytest`, `coverage` come transitively via
# `open-aea[all]`; only the IPFS CLI plugin is autonomy-specific.
open-aea-cli-ipfs = "==2.2.9"
# Optional plugins — declared via extras below.
# [hwi], [docker] and [solana] are intentionally kept out of [all]:
#   * HWI's transitive chain (ledgerwallet -> hidapi + Pillow) has
#     no armv7 wheels, breaking multi-platform Docker image builds.
#   * `docker` is only needed for docker-compose deployments; users
#     deploying to Kubernetes or localhost don't need it.
#   * `open-aea-ledger-solana` caps `websockets<12` via `solana<0.34`,
#     unresolvable against modern-websockets downstreams. Only
#     `contracts/squads_multisig` imports it. Must stay out of [all]:
#     `open-aea-test-autonomy` pins `open-autonomy[all,docker]`, which
#     would otherwise reimpose the cap on every downstream test env.
#     Revisit when the plugin accepts `solana>=0.36.2`.
open-aea-ledger-ethereum = {version = "==2.2.9", optional = true}
open-aea-ledger-ethereum-hwi = {version = "==2.2.9", optional = true}
open-aea-ledger-solana = {version = "==2.2.9", optional = true}
docker = {version = "==7.1.0", optional = true}

# ---------------------------------------------------------------------------
# Direct runtime imports from `packages/valory/**` that aren't covered
# by the `open-aea[all]` / ledger-plugin transitive chain. Each entry
# is directly `import`-ed by at least one runtime module in this repo
# (checked via `ast`-walk of `autonomy/` and `packages/valory/` outside
# `tests/` / `test_tools/`).
#
# Version policy:
#   * Unpinned (`*`) when the effective range is already constrained
#     by a ledger plugin or `open-aea[all]` transitively — we trust
#     the upstream to dictate a compatible version. Matches the `{}`
#     entries in the package YAMLs.
#   * Pinned / bounded only when the dep is version-sensitive for
#     correctness. Such ranges must stay in sync with the
#     corresponding package YAML.
# ---------------------------------------------------------------------------
open-aea-ledger-cosmos = "==2.2.9"
# `open-aea-ledger-solana` is deliberately NOT in this group: it is
# kept optional above to avoid the `websockets<12` cap, and reaches
# users through the [solana] extra. Do not move it here.
web3 = "*"
requests = "*"
grpcio = "==1.78.0"
aiohttp = ">=3.8.5,<4.0.0"
certifi = "*"
multidict = "*"
asn1crypto = ">=1.4.0,<1.5.0"
ecdsa = "*"
# Clears GHSA-mrfv-m5wm-5w6w / CVE-2025-69277. The floor backtracks
# `cosmpy 0.11.2 -> 0.11.1` within `open-aea-ledger-cosmos 2.2.9`'s
# range, because `0.11.2` hard-pins `pynacl==1.6.0` while `0.11.1`
# has no pynacl pin. Inert here — no runtime code imports cosmpy.
PyNaCl = ">=1.6.2"
py-ecc = ">=8,<10"

# Imported directly by `packages/valory/connections/abci` (and the
# generated `*_pb2.py` modules under that connection) for ABCI message
# serialization. Arrives transitively via `open-aea[all]` but the
# package-level YAMLs declare it explicitly, so it must appear here too.
protobuf = ">=5,<7"

[tool.poetry.extras]
cli = [
    "open-aea-cli-ipfs",
]
chain = [
    "open-aea-ledger-ethereum",
]
docker = [
    "docker",
]
hwi = [
    "open-aea-ledger-ethereum-hwi",
]
# Excluded from [all] — see the dependency declaration above.
solana = [
    "open-aea-ledger-solana",
]
all = [
    "open-aea-cli-ipfs",
    "open-aea-ledger-ethereum",
]

[tool.poetry.scripts]
autonomy = "autonomy.cli:cli"

[tool.poetry.group.dev.dependencies]
tomte = { version = "==0.7.0", extras = ["tox", "docs"] }
mkdocs-monorepo-plugin = "^1.0.5"
open-aea-ci-helpers = "==2.2.9"
open-aea-dev-helpers = "==2.2.9"
# Local CI/release tooling — used by `make generators`, `tox -e
# fix-doc-hashes`, etc. Not imported by any runtime code.
open-aea-helpers = { path = "plugins/aea-helpers", develop = true }
# Test tooling: `open-aea-test-autonomy` (our own plugin) supplies the
# base test classes imported from `packages/valory/**/test_tools/`;
# `hypothesis`, `pytest`, `pytest-asyncio` are only used by test
# modules (pytest is guarded via a `_PytestMissing` stub in
# `test_tools/` so skill imports work without pytest installed).
open-aea-test-autonomy = { path = "plugins/aea-test-autonomy", develop = true }
hypothesis = "*"
# Bounded to <9 to prevent unreviewed drift across pytest major versions
# (pytest 9 removes deprecated APIs and can silently break plugins /
# tox invocations on re-lock). Revisit once 9.x is validated end-to-end.
pytest = ">=8,<9"
pytest-asyncio = "*"
# Used by the docker-compose tendermint sidecar
# (`deployments/Dockerfiles/tendermint/app.py`) and a legacy test helper
# (`packages/valory/agents/register_reset/tests/helpers/slow_tendermint_server/app.py`).
# Kept out of the main deps because the runtime autonomy wheel uses
# `autonomy/deploy/_http_server.py` (stdlib-only Flask-compatible shim)
# instead.
Flask = ">=3.1.0,<4.0.0"
Werkzeug = ">=3.1.0,<4.0.0"


[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

# `aea generate-all-protocols` (open-aea ≥ 2.2.3) invokes isort with
# `--settings-path pyproject.toml`, so isort needs to find `[tool.isort]`
# here. Mirrors the values rendered into `{envtmpdir}/isort.cfg` by
# `tomte render-isort-config` in `[testenv:isort]` / `[testenv:isort-check]`
# — keep them in sync if either changes.
[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88
order_by_type = false
case_sensitive = true
lines_after_imports = -1
known_first_party = ["autonomy", "deployments"]
known_packages = ["packages"]
known_local_folder = ["tests"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "PACKAGES", "LOCALFOLDER"]
